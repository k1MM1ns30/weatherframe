<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WeatherFrame</title>
  <link rel="stylesheet" href="index.css">
</head>

<body>

  <main class="canvas" id="captureArea">

    <div class="weather-emoji" id="weatherEmoji">☀️</div>

    <div class="camera-frame">
      <div id="p5-container"></div>
    </div>

    <div class="info" id="weather">
      Loading...
    </div>

    <button id="captureBtn">Capture</button>
    <!-- <button id="cameraToggleBtn" type="button">Flip</button> -->

    <div class="city-wrapper">
      <button id="mapToggle">Location</button>

      <div class="city-buttons" id="cityButtons">
        <button class="city-btn" data-city="New York">New York</button>
        <button class="city-btn" data-city="Tokyo">Tokyo</button>
        <button class="city-btn" data-city="Seoul">Seoul</button>
        <button class="city-btn" data-city="Okinawa">Okinawa</button>
        <button class="city-btn" data-city="London">London</button>
        <button class="city-btn" data-city="Sydney">Sydney</button>
        <button class="city-btn" id="typeLocationBtn">Type my location</button>
      </div>
    </div>

    <div id="locationModal" class="location-modal hidden">
      <div class="location-modal-box">
        <p>Enter location</p>
        <input type="text" id="locationInput" placeholder="e.g. Paris, Chicago..." autocomplete="off" />
        <div class="location-modal-btns">
          <button id="locationConfirmBtn">Search</button>
          <button id="locationCancelBtn">Cancel</button>
        </div>
      </div>
    </div>

    <div class="filter-wrapper">
      <button id="filterToggle">Filter</button>

      <div id="filterButtons" class="filter-buttons">
        <button class="filter-btn" data-filter="live">Live</button>
        <button class="filter-btn" data-filter="sunny">Sunny</button>
        <button class="filter-btn" data-filter="cloudy">Cludy</button>
        <button class="filter-btn" data-filter="rain">Rain</button>
        <button class="filter-btn" data-filter="windy">Windy</button>
        <button class="filter-btn" data-filter="hot">Hot</button>
        <button class="filter-btn" data-filter="cold">Cold</button>
        <button class="filter-btn" data-filter="snow">Snow</button>
        <button class="filter-btn" data-filter="fog">Fog</button>
      </div>
    </div>

  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="index.js?v=2"></script>

</body>
</html>
